<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<h:head><title>Users</title></h:head>

<h:body>

    <h:messages />

    <h:link outcome="/users_add.xhtml" value="Add user"/>
    &#160;|&#160;
    <h:link outcome="user_edit.xhtml" value="Edit user" />
    &#160;|&#160;
    <h:link outcome="books.xhtml" value="Books" />
    &#160;|&#160;
    <h:link outcome="/loans.xhtml" value="Loans" />
    <br/><br/>

    <h1>Users</h1>

    <h:messages id="msgs" />

    <h:form>
    <h:panelGrid columns="3" style="margin-bottom:10px">
        <h:outputLabel value="Status:" />
        <h:selectOneMenu value="#{userBean.statusFilter}">
            <f:selectItem itemValue="ACTIVE" itemLabel="Active" />
            <f:selectItem itemValue="INACTIVE" itemLabel="Inactive" />
            <f:selectItem itemValue="ALL" itemLabel="All" />
        </h:selectOneMenu>
        <h:commandButton value="Apply" action="#{userBean.reload}" />
    </h:panelGrid>
    </h:form>

    <h:dataTable value="#{userBean.items}" var="u" rendered="#{not empty userBean.items}">
        <h:column><f:facet name="header">Name</f:facet>#{u.name}</h:column>
        <h:column><f:facet name="header">Email</f:facet>#{u.email}</h:column>
        <h:column><f:facet name="header">Role</f:facet>#{u.role}</h:column>
        <h:column><f:facet name="header">Active</f:facet>#{u.active}</h:column>
        <h:column>
            <h:form>
            <f:facet name="header">Actions</f:facet>
            <h:panelGroup rendered="#{u.active}">
                <h:commandLink value="Deactivate" action="#{userBean.deactivate(u.id)}"
                                 onclick="return confirm('Deactivate this user?');" />
            </h:panelGroup>
            <h:panelGroup rendered="#{!u.active}">
                <h:commandLink value="Activate" action="#{userBean.activate(u.id)}"
                               onclick="return confirm('Activate this user?');" />
            </h:panelGroup>
            </h:form>
            &#160;|&#160;
            <h:link outcome="user_edit.xhtml" value="Edit">
                <f:param name="id" value="#{u.id}" />
            </h:link>
        </h:column>
    </h:dataTable>

        <div style="margin-top:8px">
            <h:link outcome="user_edit.xhtml" value="New user"/>
        </div>

</h:body>
</html>
